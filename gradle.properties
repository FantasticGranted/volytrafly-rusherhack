# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=false

# plugin name
plugin_name = volytrafly

# plugin version — matches VolytraFly-Addon 0.1.1, the revision this port is based on
plugin_version = 0.1.1

maven_group = com.volytrafly

# use java 17 for minecraft versions 1.20.4 and older
# use java 21 for minecraft versions 1.20.5 and newer
java_version = 21

# VolytraFly-Addon targets Minecraft 1.21.11 (yarn). The example plugin's
# 1.21.4 toolchain cannot compile that game, and RusherHack publishes a
# matching 1.21.11 API snapshot, so this project builds against 1.21.11.
# other supported versions of the game can be added in rusherhack-plugin.json
minecraft_version = 1.21.11

# parchment mappings
parchment_version = 1.21.11:2025.12.20

# fabric loader version
fabric_loader_version = 0.17.2
